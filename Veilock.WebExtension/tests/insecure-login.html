
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Veilock Security Test - Insecure Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .login-box {
      background: white;
      padding: 35px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 4px 15px #0002;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 12px;
    }

    button {
      background: #177e76;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Demo Login Page</h2>
    <p>Controlled security test for Veilock.</p>

    <form action="http://example.com/login" method="POST">
      <input type="text"
             placeholder="Username"
             autocomplete="username">

      <input type="password"
             placeholder="Password"
             autocomplete="current-password">

      <button type="button">Demo Only</button>
    </form>

    <p style="font-size:12px">
      Do not enter real credentials.
    </p>
  </div>
</body>
</html>
